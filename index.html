<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#eef0ea" />
  <title>Syllabes ratées · TokiBot</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=switzer@400,500,600&display=swap" />
  <style>
    :root {
      --paper: #eef0ea;
      --cell: #fbfbf8;
      --ink: #0e1116;
      --soft: #5d636b;
      --blue: #2440ff;
      --line: 1.5px solid var(--ink);
      --display: "Cabinet Grotesk", "Switzer", system-ui, sans-serif;
      --text: "Switzer", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.19, 1, .22, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
    html { scrollbar-color: var(--ink) var(--paper); scrollbar-width: thin; }
    body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--blue); color: #fff; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px 64px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: var(--line); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    header b { font-family: var(--display); font-weight: 800; letter-spacing: .02em; }
    #lang-badge { border: var(--line); padding: 1px 8px; }

    .hero { padding: 40px 0 26px; }
    .hero p { font-size: 14px; color: var(--soft); }
    .hero h1 { font: 800 clamp(44px, 11vw, 104px)/.95 var(--display); letter-spacing: -.02em; text-transform: uppercase; margin: 6px 0 14px; overflow-wrap: anywhere; text-wrap: balance; }
    .hero .counts { font-size: 17px; color: var(--ink); }
    .hero .counts b { font-family: var(--display); font-weight: 800; font-size: 1.25em; margin-right: 2px; }
    .hero > * { animation: rise .6s var(--ease) both; }
    .hero h1 { animation-delay: .06s; }
    .hero .counts { animation-delay: .14s; }

    .tools { display: flex; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; animation: rise .6s .2s var(--ease) both; }
    .tools label { flex: 1 1 220px; display: block; }
    .tools input { width: 100%; background: transparent; border: 0; border-bottom: var(--line); font: 500 18px var(--text); padding: 8px 0; color: var(--ink); border-radius: 0; }
    .tools input::placeholder { color: var(--soft); }
    .tools input:focus { outline: none; border-bottom-color: var(--blue); box-shadow: 0 1.5px 0 var(--blue); }
    .sort { display: flex; gap: 18px; font-size: 14px; font-weight: 600; }
    .sort button { padding: 8px 0 6px; color: var(--soft); border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; }
    .sort button:hover { color: var(--ink); }
    .sort button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--blue); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); border-top: var(--line); border-left: var(--line); }
    .cell {
      position: relative; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden;
      background: var(--cell); border-right: var(--line); border-bottom: var(--line);
      transition: background .15s steps(2), color .15s steps(2);
    }
    .cell::after { /* case encrée puis révélée, en cascade */
      content: ""; position: absolute; inset: 0; background: var(--ink); transform-origin: 50% 0;
      animation: reveal .55s var(--ease) both; animation-delay: calc(var(--i) * 28ms + .25s); pointer-events: none;
    }
    .cell .syl { font: 800 clamp(26px, 6.4vw, 38px)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
    .cell .n { position: absolute; top: 6px; left: 8px; font: 600 12px var(--text); }
    .cell .w { position: absolute; bottom: 6px; right: 8px; font: 500 11px var(--text); color: var(--soft); transition: color .15s; }
    .cell:not([disabled]):hover, .cell:not([disabled]):focus-visible { background: var(--blue); color: #fff; }
    .cell:not([disabled]):hover .w { color: #fff; }
    .cell:not([disabled]):active .syl { transform: translateY(2px); }
    .cell[disabled] { cursor: default; background: var(--paper); color: var(--soft); }
    .none { grid-column: 1 / -1; padding: 40px 20px; border-right: var(--line); border-bottom: var(--line); background: var(--cell); }

    dialog { margin: auto; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--cell); color: var(--ink); border: 2px solid var(--ink); padding: 0; overflow: hidden; }
    dialog::backdrop { background: rgba(14, 17, 22, .55); }
    dialog[open] { animation: sheet .35s var(--ease); }
    dialog[open]::backdrop { animation: fade .25s ease; }
    .d-head { display: flex; align-items: stretch; border-bottom: 2px solid var(--ink); }
    .d-head h2 { flex: 1; padding: 12px 18px; font: 800 44px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 12px; }
    .d-head h2 small { font: 500 14px var(--text); letter-spacing: 0; text-transform: none; color: var(--soft); }
    .sq { width: 56px; display: grid; place-items: center; border-left: 2px solid var(--ink); transition: background .15s steps(2), color .15s steps(2); }
    .sq:hover { background: var(--blue); color: #fff; }
    .sq svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: square; }
    .d-body { overflow-y: auto; max-height: calc(100dvh - 130px); scrollbar-width: thin; scrollbar-color: var(--ink) var(--cell); }
    .words { list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); }
    .words li { border-bottom: 1px solid var(--ink); }
    .words li:nth-child(odd) { border-right: 1px solid var(--ink); }
    .word { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 18px; text-align: left; font: 500 18px var(--text);
      transition: background .15s steps(2), color .15s steps(2); animation: rowin .4s var(--ease) both; animation-delay: calc(var(--i) * 16ms); }
    .word mark { background: none; color: var(--blue); font-weight: 600; }
    .word .tag { font-size: 12px; color: transparent; transition: color .15s; }
    .word:hover, .word:focus-visible { background: var(--ink); color: var(--cell); }
    .word:hover mark, .word:focus-visible mark { color: #8fa0ff; }
    .word:hover .tag, .word:focus-visible .tag, .word.copied .tag { color: currentColor; }
    .word.copied { background: var(--blue); color: #fff; }
    .word.copied mark { color: #fff; }
    .hint { padding: 12px 18px; font-size: 13px; color: var(--soft); }

    .empty { padding: 90px 0; max-width: 40ch; }
    .empty strong { display: block; font: 800 32px/1.1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
    footer { margin-top: 40px; font-size: 13px; color: var(--soft); }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes reveal { from { transform: scaleY(1); } to { transform: scaleY(0); } }
    @keyframes sheet { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rowin { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .cell::after { display: none; } }
    @media (max-width: 560px) {
      dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-left: 0; border-right: 0; border-bottom: 0; }
      .words { grid-template-columns: 1fr; }
      .words li:nth-child(odd) { border-right: 0; }
      .d-head h2 { font-size: 36px; }
      .sq { width: 48px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <span><b>TokiBot</b> · BombParty</span>
    <span id="lang-badge">FR</span>
  </header>
  <main id="root"></main>
  <footer>Lien généré par TokiBot en fin de partie.</footer>
</div>

<dialog id="dlg" aria-labelledby="d-title">
  <div class="d-head">
    <h2 id="d-title"></h2>
    <button class="sq" id="d-prev" aria-label="Syllabe précédente"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <button class="sq" id="d-next" aria-label="Syllabe suivante"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
    <button class="sq" id="d-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  </div>
  <div class="d-body">
    <ul class="words" id="d-words"></ul>
    <p class="hint">Touche un mot pour le copier.</p>
  </div>
</dialog>

<script>
(function () {
  // URL : ?n=Pseudo&s=OO,AT&lang=fr   (les mots viennent de data/<lang>.json)
  const p = new URLSearchParams(location.search);
  const nick = (p.get('n') || '').trim();
  const lang = (p.get('lang') || 'fr').toLowerCase();
  const LANG_FILE = { fr: 'fr', en: 'en', de: 'de', es: 'es', na: 'es', it: 'it', po: 'po', br: 'po', ba: 'ba' };
  const raw = (p.get('s') || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

  // Doublons -> compteur ; "plus ratées" trie par compteur décroissant (ordre de jeu conservé à égalité)
  const counts = new Map();
  raw.forEach(s => counts.set(s, (counts.get(s) || 0) + 1));
  const syls = [...counts.keys()];

  document.getElementById('lang-badge').textContent = lang.toUpperCase();
  const root = document.getElementById('root');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (!syls.length) {
    root.innerHTML = '<div class="empty"><strong>Aucune donnée</strong>Ce lien est généré automatiquement par TokiBot en fin de partie.</div>';
    return;
  }

  const plural = (n, a, b) => n + ' ' + (n > 1 ? b : a);
  root.innerHTML = `
    <section class="hero">
      <p>Syllabes ratées de</p>
      <h1>${esc(nick || '—')}</h1>
      <div class="counts"><b>${raw.length}</b> ${raw.length > 1 ? 'ratées' : 'ratée'} · <b>${syls.length}</b> ${syls.length > 1 ? 'syllabes différentes' : 'syllabe'}</div>
    </section>
    <div class="tools">
      <label><input id="q" type="search" placeholder="Chercher une syllabe" autocomplete="off" spellcheck="false" aria-label="Chercher une syllabe" /></label>
      <div class="sort" role="group" aria-label="Tri">
        <button data-sort="game" aria-pressed="true">Ordre de jeu</button>
        <button data-sort="count" aria-pressed="false">Plus ratées</button>
      </div>
    </div>
    <div class="grid" id="grid" aria-busy="true"></div>`;

  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  let data = {}, sort = 'game', visible = [];

  function draw() {
    const f = q.value.trim().toUpperCase();
    const base = sort === 'count' ? [...syls].sort((a, b) => counts.get(b) - counts.get(a)) : syls;
    visible = base.filter(s => !f || s.includes(f));
    grid.innerHTML = visible.length ? visible.map((s, i) => {
      const n = (data[s.toLowerCase()] || []).length, c = counts.get(s);
      return `<button class="cell" data-syl="${esc(s)}" style="--i:${Math.min(i, 40)}"${n ? '' : ' disabled'}>
        ${c > 1 ? `<span class="n">×${c}</span>` : ''}
        <span class="syl">${esc(s)}</span>
        <span class="w">${n ? plural(n, 'mot', 'mots') : 'aucun mot'}</span>
      </button>`;
    }).join('') : '<div class="none">Aucun résultat.</div>';
  }

  q.addEventListener('input', draw);
  document.querySelector('.sort').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sort = b.dataset.sort;
    document.querySelectorAll('.sort button').forEach(x => x.setAttribute('aria-pressed', x === b));
    draw();
  });

  const dlg = document.getElementById('dlg');
  function show(list, i) {
    const syl = list[i], words = data[syl.toLowerCase()];
    const re = new RegExp('(' + syl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    document.getElementById('d-title').innerHTML = `${esc(syl)}<small>${plural(words.length, 'mot', 'mots')}</small>`;
    document.getElementById('d-words').innerHTML = words.map((w, k) =>
      `<li><button class="word" data-w="${esc(w)}" style="--i:${Math.min(k, 30)}"><span>${esc(w).replace(re, '<mark>$1</mark>')}</span><span class="tag">copier</span></button></li>`).join('');
    document.querySelector('.d-body').scrollTop = 0;
    dlg._list = list; dlg._i = i;
  }
  const step = d => { const l = dlg._list; if (l) show(l, (dlg._i + d + l.length) % l.length); };

  grid.addEventListener('click', e => {
    const c = e.target.closest('.cell'); if (!c || c.disabled) return;
    const list = visible.filter(s => (data[s.toLowerCase()] || []).length);
    show(list, list.indexOf(c.dataset.syl));
    if (!dlg.open) dlg.showModal();
  });
  document.getElementById('d-close').onclick = () => dlg.close();
  document.getElementById('d-prev').onclick = () => step(-1);
  document.getElementById('d-next').onclick = () => step(1);
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  document.getElementById('d-words').addEventListener('click', e => {
    const b = e.target.closest('.word'); if (!b) return;
    navigator.clipboard?.writeText(b.dataset.w).then(() => {
      b.classList.add('copied'); b.querySelector('.tag').textContent = 'copié';
      setTimeout(() => { b.classList.remove('copied'); b.querySelector('.tag').textContent = 'copier'; }, 900);
    }).catch(() => {});
  });

  fetch('data/' + (LANG_FILE[lang] || 'fr') + '.json')
    .then(r => r.ok ? r.json() : {})
    .catch(() => ({}))
    .then(d => { data = d; grid.removeAttribute('aria-busy'); draw(); });
})();
</script>
</body>
</html>
