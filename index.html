<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Syllabes ratées · TokiBot</title>
  <style>
    :root {
      --bg: #0b0a14;
      --surface: #14122a;
      --surface-2: #1c1938;
      --line: #2a2650;
      --accent: #8b6cf0;
      --accent-2: #b9a2ff;
      --text: #ece8ff;
      --muted: #8a84b4;
      --ok: #6ee7a8;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(900px 500px at 50% -120px, #241d52 0%, transparent 70%), var(--bg);
      background-repeat: no-repeat;
      color: var(--text); font-family: var(--sans); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

    .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px 80px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
    .brand { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .brand b { color: var(--accent-2); }
    .badge { font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--accent-2);
      background: var(--surface); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; }

    .hero { padding: 32px 0 28px; animation: up .5s ease both; }
    .hero small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .hero h1 { font-size: clamp(40px, 9vw, 72px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05;
      margin: 8px 0 20px; overflow-wrap: anywhere; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; }
    .stat b { display: block; font-size: 26px; font-weight: 700; color: var(--accent-2); line-height: 1.1; }
    .stat span { font-size: 12px; color: var(--muted); }

    .tools { display: flex; gap: 10px; margin: 8px 0 18px; animation: up .5s .08s ease both; }
    .tools input {
      flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      color: var(--text); font: 15px var(--sans); padding: 12px 16px;
    }
    .tools input::placeholder { color: var(--muted); }
    .tools input:focus { outline: none; border-color: var(--accent); }
    .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
    .seg button { background: none; border: 0; border-radius: 9px; padding: 8px 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; animation: up .5s .14s ease both; }
    .card {
      position: relative; text-align: left; cursor: pointer; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px 14px;
      transition: transform .12s, border-color .12s, background .12s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--surface-2); }
    .card .syl { display: block; font: 700 26px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    .card .meta { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .card .times { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700;
      color: var(--bg); background: var(--accent-2); border-radius: 999px; padding: 1px 7px; }
    .card[disabled] { opacity: .45; cursor: default; transform: none; border-color: var(--line); background: var(--surface); }
    .none { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--muted); }

    dialog {
      margin: auto; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 20px;
      padding: 0; overflow: hidden;
    }
    dialog::backdrop { background: rgba(5, 4, 12, .72); backdrop-filter: blur(3px); }
    dialog[open] { animation: pop .18s ease; }
    .d-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .d-head h2 { flex: 1; font: 700 32px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .d-head h2 small { font: 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 10px; }
    .icon { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 16px; }
    .icon:hover { border-color: var(--accent); }
    .d-body { padding: 18px 20px 22px; overflow-y: auto; max-height: calc(100vh - 140px); }
    .words { display: flex; flex-wrap: wrap; gap: 8px; }
    .word {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; font: 15px var(--mono); cursor: pointer; transition: border-color .1s;
    }
    .word:hover { border-color: var(--accent); }
    .word.copied { border-color: var(--ok); color: var(--ok); }
    .word mark { background: none; color: var(--accent-2); font-weight: 700; }
    .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }

    .empty { text-align: center; padding: 90px 0; color: var(--muted); }
    .empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 8px; }
    footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--muted); }

    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    @media (max-width: 520px) { .tools { flex-wrap: wrap; } .seg { width: 100%; } .seg button { flex: 1; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand"><b>Toki</b>Bot · BombParty</span>
    <span class="badge" id="lang-badge">FR</span>
  </header>
  <main id="root"></main>
  <footer>Généré par TokiBot en fin de partie</footer>
</div>

<dialog id="dlg" aria-labelledby="d-title">
  <div class="d-head">
    <button class="icon" id="d-prev" aria-label="Syllabe précédente">←</button>
    <h2 id="d-title"></h2>
    <button class="icon" id="d-next" aria-label="Syllabe suivante">→</button>
    <button class="icon" id="d-close" aria-label="Fermer">✕</button>
  </div>
  <div class="d-body">
    <div class="words" id="d-words"></div>
    <p class="hint">Clique sur un mot pour le copier.</p>
  </div>
</dialog>

<script>
(function () {
  // URL : ?n=Pseudo&s=OO,AT&lang=fr   (les mots viennent de data/<lang>.json)
  const p = new URLSearchParams(location.search);
  const nick = (p.get('n') || '').trim();
  const lang = (p.get('lang') || 'fr').toLowerCase();
  const LANG_FILE = { fr: 'fr', en: 'en', de: 'de', es: 'es', na: 'es', it: 'it', po: 'po', br: 'po', ba: 'ba' };
  const raw = (p.get('s') || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);

  // Doublons -> compteur ; plus ratées d'abord, puis ordre de la partie
  const counts = new Map();
  raw.forEach(s => counts.set(s, (counts.get(s) || 0) + 1));
  const syls = [...counts.keys()];
  const byCount = () => [...syls].sort((a, b) => counts.get(b) - counts.get(a));

  document.getElementById('lang-badge').textContent = lang.toUpperCase();
  const root = document.getElementById('root');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (!syls.length) {
    root.innerHTML = '<div class="empty"><strong>Aucune donnée</strong>Ce lien est généré automatiquement par TokiBot en fin de partie.</div>';
    return;
  }

  root.innerHTML = `
    <section class="hero">
      <small>Syllabes ratées de</small>
      <h1>${esc(nick || '—')}</h1>
      <div class="stats">
        <div class="stat"><b>${raw.length}</b><span>ratée${raw.length > 1 ? 's' : ''} au total</span></div>
        <div class="stat"><b>${syls.length}</b><span>syllabe${syls.length > 1 ? 's' : ''} différente${syls.length > 1 ? 's' : ''}</span></div>
      </div>
    </section>
    <div class="tools">
      <input id="q" type="search" placeholder="Filtrer les syllabes…" autocomplete="off" spellcheck="false" aria-label="Filtrer" />
      <div class="seg" role="group" aria-label="Tri">
        <button data-sort="game" aria-pressed="true">Ordre de jeu</button>
        <button data-sort="count" aria-pressed="false">Plus ratées</button>
      </div>
    </div>
    <div class="grid" id="grid" aria-busy="true"></div>`;

  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  let data = {};
  let sort = 'game';
  let visible = [];

  function draw() {
    const f = q.value.trim().toUpperCase();
    visible = (sort === 'count' ? byCount() : syls).filter(s => !f || s.includes(f));
    grid.innerHTML = visible.length ? visible.map(s => {
      const n = (data[s.toLowerCase()] || []).length;
      const c = counts.get(s);
      return `<button class="card" data-syl="${esc(s)}"${n ? '' : ' disabled'}>
        ${c > 1 ? `<span class="times">×${c}</span>` : ''}
        <span class="syl">${esc(s)}</span>
        <span class="meta">${n ? n + ' mot' + (n > 1 ? 's' : '') : 'aucun mot'}</span>
      </button>`;
    }).join('') : '<div class="none">Aucun résultat.</div>';
  }

  q.addEventListener('input', draw);
  document.querySelector('.seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sort = b.dataset.sort;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    draw();
  });

  const dlg = document.getElementById('dlg');
  let cur = -1;
  function open(i) {
    const list = visible.filter(s => (data[s.toLowerCase()] || []).length);
    cur = list.indexOf(visible[i] !== undefined ? visible[i] : visible[0]);
    show(list, cur);
    if (!dlg.open) dlg.showModal();
  }
  function show(list, i) {
    const syl = list[i], words = data[syl.toLowerCase()];
    const re = new RegExp('(' + syl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    document.getElementById('d-title').innerHTML = `${esc(syl)}<small>${words.length} mot${words.length > 1 ? 's' : ''}</small>`;
    document.getElementById('d-words').innerHTML = words.map(w =>
      `<button class="word" data-w="${esc(w)}">${esc(w).replace(re, '<mark>$1</mark>')}</button>`).join('');
    dlg._list = list; dlg._i = i;
  }
  function step(d) {
    const l = dlg._list; if (!l) return;
    show(l, (dlg._i + d + l.length) % l.length);
  }

  grid.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c || c.disabled) return;
    open(visible.indexOf(c.dataset.syl));
  });
  document.getElementById('d-close').onclick = () => dlg.close();
  document.getElementById('d-prev').onclick = () => step(-1);
  document.getElementById('d-next').onclick = () => step(1);
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  document.getElementById('d-words').addEventListener('click', e => {
    const b = e.target.closest('.word'); if (!b) return;
    navigator.clipboard?.writeText(b.dataset.w).then(() => {
      b.classList.add('copied'); setTimeout(() => b.classList.remove('copied'), 900);
    }).catch(() => {});
  });

  fetch('data/' + (LANG_FILE[lang] || 'fr') + '.json')
    .then(r => r.ok ? r.json() : {})
    .catch(() => ({}))
    .then(d => { data = d; grid.removeAttribute('aria-busy'); draw(); });
})();
</script>
</body>
</html>
